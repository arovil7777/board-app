<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>게시글 상세보기</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>

<body>
    <div class="container">
        <h2 th:text="${board.title}"></h2>
        <p th:text="'작성자: ' + ${board.user.username}"></p>
        <div th:utext="${board.content}"></div>

        <!-- 댓글 섹션 -->
        <hr />
        <h4>댓글</h4>
        <div th:if="${#lists.isEmpty(board.comments)}">
            <p>댓글이 없습니다.</p>
        </div>
        <div th:each="comment : ${board.comments}">
            <div class="mb-2">
                <strong th:text="${comment.user.username}"></strong>
                <small th:text="${#dates.format(comment.createdDate, 'yyyy-MM-dd HH:mm')}"></small>
                <p th:text="{comment.content}"></p>
            </div>
        </div>

        <!-- 댓글 작성 폼 -->
        <form th:action="@{/comments/write}" method="post">
            <input type="hidden" name="boardId" th:value="${board.id}" />
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="3" placeholder="댓글을 입력하세요" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">댓글 작성</button>
        </form>

        <br />
        <a th:href="@{/boards}" class="btn btn-secondary">목록으로</a>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/custom.js"></script>
</body>

</html>
