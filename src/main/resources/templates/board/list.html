<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>게시판 목록</title>
</head>

<body>
    <h2>게시판 목록</h2>
    <table border="1">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>액션</th>
        </tr>
        <tr th:each="board : ${boards}">
            <td th:text="${board.id}"></td>
            <td><a th:href="@{/board/detail/{id}(id=${board.id})}" th:text="${board.title}"></a></td>
            <td th:text="${board.writer}"></td>
            <td th:text="${board.createdAt}"></td>
            <td><a th:href="@{/board/delete/{id}(id=${board.id})}">삭제</a></td>
        </tr>
    </table>
    <a th:href="@{/board/form}">새 글 작성</a>
</body>

</html>
