<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>게시글 작성/수정</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>

<body>
    <div class="container">
        <h2 th:text="${board.id == null ? '새 게시글 작성' : '게시글 수정'}"></h2>
        <form th:action="@{/boards/save}" th:object="${board}" method="post">
            <div class="form-group">
                <label>제목</label>
                <input type="text" th:field="*{title}" class="form-control" required />
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea th:field="*{content}" class="form-control" rows="5" required></textarea>
            </div>
            <br />
            <button type="submit" class="btn btn-primary">저장</button>
            <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
        </form>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/custom.js"></script>
</body>

</html>
